name: Build image

on:
  # Start manually (Actions -> "Build image" -> Run workflow)
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v1.0 (empty = build only, image as artifact)"
        required: false
        default: ""
  # Or by pushing a tag: git tag v1.0 && git push origin v1.0
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    # Native arm64 runner (free for public repositories): no qemu needed.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils fdisk e2fsprogs systemd-container
          if [ "$(uname -m)" != aarch64 ]; then
            sudo apt-get install -y qemu-user-static binfmt-support
          fi

      - name: Build image
        run: sudo ./build.sh

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            work/dietpi-firstrun-container.log
            out/dietpi-firstrun-setup.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-image
          path: |
            out/nexus.img.xz
            out/nexus.img.xz.sha256
          compression-level: 0
          retention-days: 14

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          gh release create "$TAG" \
            out/nexus.img.xz out/nexus.img.xz.sha256 \
            --title "nexus $TAG" \
            --notes-file out/release-notes.md \
            --target "$GITHUB_SHA"
